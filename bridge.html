<!DOCTYPE html><html><head><meta charset="utf-8"><title>Herb settings bridge</title></head><body><script>
// Keeps Herb's settings for copies of Herb that run where storage is blocked or reset (e.g. embedded in Google Sites).
// Only Herb's own setting keys are read or written; nothing else on this address is touched.
var ALLOW = /^herb\.(settings|proxyEngine|bookmarks|iconpos|wisp\.pin|ip\.recents|ip\.darktheme|side\.rail|iptut|tutorial\.done)$/;
addEventListener('message', function (e) {
  var d = e.data; if (!d || !d.herbBridge || !e.source) return;
  try {
    if (d.herbBridge === 'get') {
      var o = {}; for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (ALLOW.test(k)) o[k] = localStorage.getItem(k); }
      e.source.postMessage({ herbBridge: 'data', d: o }, '*');
    } else if (d.herbBridge === 'set' && d.d) {
      Object.keys(d.d).forEach(function (k) { if (!ALLOW.test(k)) return; var v = d.d[k]; if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, String(v).slice(0, 300000)); });
      var o2 = {}; for (var j = 0; j < localStorage.length; j++) { var k2 = localStorage.key(j); if (ALLOW.test(k2)) o2[k2] = localStorage.getItem(k2); }
      e.source.postMessage({ herbBridge: 'data', d: o2 }, '*');   // confirm what's stored now
    }
  } catch (err) { try { e.source.postMessage({ herbBridge: 'error', m: String(err) }, '*'); } catch (x) {} }
});
try { parent.postMessage({ herbBridge: 'ready' }, '*'); } catch (e) {}
</script></body></html>
