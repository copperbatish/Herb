<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herb AI</title>
<link rel="stylesheet" href="/css/herb.css"><link rel="stylesheet" href="/css/app.css">
<style>
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--text);font-family:var(--font);display:flex;overflow:hidden}
button{font:inherit;color:inherit}
#side{width:272px;flex:none;display:flex;flex-direction:column;background:var(--surface-2);border-right:1px solid var(--border);min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;font-weight:700;font-size:16px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#6ee7b7,#059669);display:flex;align-items:center;justify-content:center;color:#04130d;flex:none}
#newchat{margin:6px 14px 10px;padding:11px 14px;border-radius:12px;border:0;background:var(--accent);color:#04130d;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
#newchat:hover{filter:brightness(1.08)}
#q{margin:0 14px 10px;width:calc(100% - 28px);height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:0 12px;font-size:13.5px;outline:0}#q:focus{border-color:var(--accent)}
#list{flex:1;overflow-y:auto;padding:0 8px 10px;min-height:0}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 6px;font-weight:700}
.ci{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13.5px;position:relative}
.ci:hover{background:rgba(255,255,255,.06)}.ci.on{background:rgba(var(--accent-rgb),.2)}
.ci .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci .acts{display:none;gap:2px}.ci:hover .acts,.ci.on .acts{display:flex}
.ci .acts button{background:none;border:0;border-radius:6px;padding:3px 6px;cursor:pointer;color:var(--muted);font-size:13px}.ci .acts button:hover{background:rgba(255,255,255,.12);color:var(--text)}
.none{padding:18px 14px;color:var(--muted);font-size:13px;text-align:center}
.me{padding:12px 16px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}.me b{color:var(--text)}
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#top{flex:none;display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--border)}
#menu{display:none;background:rgba(255,255,255,.08);border:0;border-radius:9px;width:34px;height:34px;cursor:pointer;font-size:16px}
#ttl{flex:1;min-width:0;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#log{flex:1;overflow-y:auto;padding:22px 18px 10px;min-height:0}
.wrap{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.msg{display:flex;flex-direction:column;gap:6px;max-width:100%}
.msg .who{font-size:11.5px;color:var(--muted)}
.msg.user{align-items:flex-end}
.msg.user .bub{background:var(--accent);color:#04130d;border-radius:16px 16px 4px 16px;padding:10px 14px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.assistant .bub{background:var(--surface-2);border:1px solid var(--border);border-radius:16px 16px 16px 4px;padding:13px 17px;max-width:100%;overflow-wrap:anywhere;line-height:1.65;font-size:14.5px}
.msg.error .bub{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.35);color:#fca5a5;border-radius:12px;padding:10px 14px;font-size:13.5px}
.macts{display:flex;gap:6px;opacity:0;transition:opacity .15s}.msg:hover .macts,.msg:last-child .macts{opacity:1}
.macts button{background:none;border:1px solid var(--border);border-radius:8px;padding:3px 10px;font-size:12px;color:var(--muted);cursor:pointer}.macts button:hover{color:var(--text);border-color:var(--accent)}
.bub>*:first-child{margin-top:0}.bub>*:last-child{margin-bottom:0}
.bub p{margin:.6em 0}.bub h1,.bub h2,.bub h3,.bub h4{margin:1em 0 .4em;line-height:1.25}.bub h1{font-size:1.25em}.bub h2{font-size:1.15em}.bub h3,.bub h4{font-size:1.05em}
.bub ul,.bub ol{margin:.5em 0;padding-left:1.4em}.bub li{margin:.2em 0}.bub hr{border:0;border-top:1px solid var(--border);margin:1em 0}
.bub blockquote{margin:.6em 0;padding:2px 12px;border-left:3px solid var(--accent);color:var(--muted)}
.bub a{color:var(--accent)}.bub code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:rgba(255,255,255,.09);padding:1px 5px;border-radius:5px}
.bub table{border-collapse:collapse;margin:.8em 0;display:block;overflow-x:auto;font-size:.95em}.bub th,.bub td{border:1px solid var(--border);padding:6px 11px;text-align:left}.bub th{background:rgba(255,255,255,.06)}
.code{margin:.8em 0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#0a120e}
.code .bar{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 12px;background:rgba(255,255,255,.06);font-size:11.5px;color:var(--muted)}
.code .bar button{background:rgba(255,255,255,.08);border:0;border-radius:7px;color:var(--text);font-size:11.5px;padding:4px 10px;cursor:pointer}
.code pre{margin:0;padding:12px 14px;overflow-x:auto;font-size:13px;line-height:1.55}.code pre code{background:none;padding:0;font-size:inherit}
.t-k{color:#c4b5fd}.t-s{color:#86efac}.t-c{color:#7c9a8a;font-style:italic}.t-n{color:#fcd34d}
.cursor::after{content:"";display:inline-block;width:7px;height:1em;margin-left:2px;background:var(--accent);vertical-align:text-bottom;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.hello{text-align:center;color:var(--muted);padding:9vh 12px 0}.hello .logo{width:56px;height:56px;border-radius:17px;margin:0 auto 14px}
.hello h2{margin:0 0 6px;color:var(--text);font-size:22px}.hello p{margin:0 0 20px;font-size:14px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;max-width:640px;margin:0 auto}
.chips button{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:12px 14px;font-size:13px;cursor:pointer;text-align:left;line-height:1.4}.chips button:hover{border-color:var(--accent)}.chips b{display:block;margin-bottom:2px;font-size:13px}.chips span{color:var(--muted);font-size:12px}
#foot{flex:none;padding:10px 18px 14px}
.box{max-width:800px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;background:var(--surface-2);border:1px solid var(--border);border-radius:18px;padding:8px 8px 8px 16px}.box:focus-within{border-color:var(--accent)}
textarea{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;resize:none;max-height:200px;padding:8px 0;line-height:1.4}
#send{border:0;border-radius:12px;padding:9px 16px;cursor:pointer;font-weight:700;font-size:13.5px;background:var(--accent);color:#04130d}#send.stop{background:rgba(248,113,113,.22);color:#fca5a5}
.note{max-width:800px;margin:8px auto 0;color:var(--muted);font-size:11.5px;text-align:center}
#gate{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:var(--surface);text-align:center;padding:24px}
#gate .in{max-width:380px}#gate .logo{width:60px;height:60px;border-radius:18px;margin:0 auto 16px}#gate h2{margin:0 0 8px}#gate p{color:var(--muted);line-height:1.6;margin:0 0 20px}
#gate button{border:0;border-radius:12px;padding:12px 22px;background:var(--accent);color:#04130d;font-weight:700;font-size:15px;cursor:pointer}
body.out .me,body.out #q{display:none}
@media(max-width:720px){#side{position:fixed;left:0;top:0;bottom:0;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.5)}#side.open{transform:none}#menu{display:block}}
</style></head>
<body>

</aside>

  <div id="gate"><div class="in"><div class="logo" id="glogo"></div><h2>Sign in to use Herb AI</h2><p>Herb AI is for signed-in accounts. Your chats are saved to your account, so you can pick them up on any device.</p><button id="gatebtn">Sign in or create account</button></div></div>
</div>
<script src="/js/herb-config.js"></script><script src="/js/herb-settings.js"></script><script src="/js/icons.js"></script>

    var keep = hist.slice(-60), data = JSON.stringify(keep); while (data.length > 190000 && keep.length > 2) { keep = keep.slice(2); data = JSON.stringify(keep); }
    var now = Date.now(); chats[cur] = { title: title, updated: now }; renderList();
    var u = {}; u['herb/aichats/' + uid + '/data/' + cur] = data; u['herb/aichats/' + uid + '/meta/' + cur] = { title: title, updated: now };
    db().ref().update(u).catch(function () {});
  }

  // ---------- talking to the server ----------
  function stick() { var near = log.scrollHeight - log.scrollTop - log.clientHeight < 140; if (near) log.scrollTop = log.scrollHeight; }
  function setBusy(b) { busy = b; var s = $('send'); s.textContent = b ? 'Stop' : 'Send'; s.className = b ? 'stop' : ''; }
  function stop() { if (ctl) ctl.abort(); }
  function post(body, signal, token) {
    var i = 0;
    function next() {
      return fetch(HOSTS[i] + '/api/herb-ai', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: body, signal: signal }).catch(function (e) {
        if (e.name === 'AbortError' || ++i >= HOSTS.length) throw e; return next();   // server unreachable: try the next hostname
      });
    }
    return next();
  }
  function run() {   // streams a reply to whatever is in hist (which must end with a user message)
    if (busy || !hist.length) return;
    if (!cur) { cur = newId(); }
    var wasEmpty = wrap.querySelector('.hello'); if (wasEmpty) wrap.innerHTML = '';
    wrap.querySelectorAll('.macts').forEach(function (x) { x.remove(); });
    var el = addMsg('assistant', ''), bub = el.querySelector('.bub'), got = '', raf = 0; bub.classList.add('cursor'); log.scrollTop = log.scrollHeight;
    $('ttl').textContent = chats[cur] ? chats[cur].title : mkTitle(hist[0].content);
    function paint() { raf = 0; bub.innerHTML = md(got); bub.classList.add('cursor'); stick(); }
    function fail(msg) { if (got) bub.classList.remove('cursor'); else el.remove(); addMsg('error', msg); stick(); }
    ctl = new AbortController(); setBusy(true);
    var payload = JSON.stringify({ messages: hist.slice(-30) });
    HerbAuth.token().then(function (tok) { if (!tok) throw new Error('Please sign in again.'); return post(payload, ctl.signal, tok).then(function (r) {
      if (r.status === 401) return HerbAuth.token(true).then(function (t2) { return t2 ? post(payload, ctl.signal, t2) : r; });
      return r;
    }); }).then(function (r) {
      if (!r.ok) return r.json().catch(function () { return {}; }).then(function (j) { throw new Error(r.status === 401 ? 'Please sign in again.' : (j.message || 'Herb AI had a hiccup. Try again.')); });
      var rd = r.body.getReader(), dec = new TextDecoder(), buf = '', errMsg = '';
      function pump() {
        return rd.read().then(function (x) {
          if (x.done) return;
          buf += dec.decode(x.value, { stream: true }); var lines = buf.split('\n'); buf = lines.pop();
          lines.forEach(function (ln) {
            ln = ln.trim(); if (ln.indexOf('data:') !== 0) return; var d = ln.slice(5).trim(); if (!d || d === '[DONE]') return;
            try { var j = JSON.parse(d); if (j.error) errMsg = 'Herb AI is cooling down, try again shortly.'; var dl = j.choices && j.choices[0] && j.choices[0].delta, c = dl && dl.content; if (dl && dl.reasoning && !got) bub.innerHTML = '<span style="color:var(--muted)">Thinking\u2026</span>'; if (c) { got += c; if (!raf) raf = requestAnimationFrame(paint); } } catch (e) {}
          });
          return pump();
        });
      }
      return pump().then(function () { if (errMsg && !got) throw new Error(errMsg); });
    }).then(function () {
      if (raf) cancelAnimationFrame(raf); bub.classList.remove('cursor'); bub.innerHTML = md(got);
      if (got) { hist.push({ role: 'assistant', content: got }); persist(); } else { el.remove(); addMsg('error', 'No answer came back. Try again.'); }
    }).catch(function (e) {
      if (raf) cancelAnimationFrame(raf);
      if (e.name === 'AbortError') { bub.classList.remove('cursor'); if (got) { bub.innerHTML = md(got); hist.push({ role: 'assistant', content: got }); persist(); } else { el.remove(); } return; }
      var m = e.message || ''; fail(/Failed to fetch|NetworkError|Load failed/i.test(m) ? 'Can\u2019t reach Herb AI right now. Check your connection and try again.' : m);
    }).then(function () { ctl = null; setBusy(false); actions(); ta.focus(); });
  }
  function send(text) {
    text = (text || ta.value).trim(); if (!text || busy) return; if (!uid) return gate();
    ta.value = ''; ta.style.height = 'auto'; if (!cur) cur = newId();
    if (wrap.querySelector('.hello')) wrap.innerHTML = '';
    hist.push({ role: 'user', content: text }); addMsg('user', text);
    if (!chats[cur]) { chats[cur] = { title: mkTitle(text), updated: Date.now() }; renderList(); }
    run();
  }
  $('send').onclick = function () { busy ? stop() : send(); };
  ta.addEventListener('input', function () { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 200) + 'px'; });
  ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
  wrap.addEventListener('click', function (e) {
    var c = e.target.closest('[data-copy]');
    if (c) { var t = c.closest('.code').querySelector('code').textContent; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { c.textContent = 'Copied'; }, function () { c.textContent = 'Press Ctrl+C'; }); setTimeout(function () { c.textContent = 'Copy'; }, 1600); return; }
    var s = e.target.closest('.chips button'); if (s) return send(SUGGEST[+s.dataset.i][1]);
    var a = e.target.closest('.macts button'); if (!a || busy) return;
    if (a.dataset.a === 'copy') { var last = hist[hist.length - 1]; if (last) (navigator.clipboard ? navigator.clipboard.writeText(last.content) : Promise.reject()).then(function () { a.textContent = 'Copied'; setTimeout(function () { a.textContent = 'Copy'; }, 1400); }, function () {}); }
    else if (a.dataset.a === 'regen') { if (hist.length && hist[hist.length - 1].role === 'assistant') hist.pop(); render(); run(); }
    else if (a.dataset.a === 'edit') { var l = hist[hist.length - 1]; if (l && l.role === 'assistant') hist.pop(); var u = hist.pop(); render(); ta.value = u ? u.content : ''; ta.dispatchEvent(new Event('input')); ta.focus(); }
  });

  // ---------- sign-in ----------
  function gate() { $('gate').style.display = uid ? 'none' : 'flex'; document.body.classList.toggle('out', !uid); }
  $('gatebtn').onclick = function () { try { parent.document.getElementById('acctchip').click(); } catch (e) {} };
  HerbAuth.onChange(function (s) {
    var nu = s.user ? s.user.uid : null; if (nu === uid && ready) return; uid = nu; ready = true;
    if (metaRef) { try { metaRef.off(); } catch (e) {} metaRef = null; }
    chats = {}; cur = null; hist = []; $('mename').textContent = s.name || ''; render(); renderList(); gate();
    if (uid) { metaRef = db().ref('herb/aichats/' + uid + '/meta'); metaRef.on('value', function (sn) { chats = sn.val() || {}; renderList(); if (cur && chats[cur]) $('ttl').textContent = chats[cur].title; }, function () {}); }
  });
  if (!HerbAuth.available()) { $('gate').style.display = 'flex'; }
  render(); renderList(); gate();
})();
</script></body></html>
