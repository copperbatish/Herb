<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/images/logo/herb.svg" type="image/svg+xml"><title>Movies</title>
<link rel="stylesheet" href="/css/herb.css"><link rel="stylesheet" href="/css/app.css">
<style>
html,body{height:100%}
body{margin:0;overflow:hidden;display:flex;flex-direction:column;background:var(--surface)}
header{flex:none;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 22px;background:linear-gradient(180deg,var(--surface-2),var(--surface));border-bottom:1px solid var(--border)}
header h1{margin:0;font-size:22px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px}
.tabs button{background:none;border:0;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600}
.tabs button:hover{color:var(--text)}.tabs button.on{background:rgba(var(--accent-rgb),.22);color:var(--text)}
.search{flex:1;min-width:180px;max-width:380px;margin-left:auto;display:flex;align-items:center;gap:10px;height:38px;padding:0 14px;background:var(--surface);border:1px solid var(--border);border-radius:999px;color:var(--muted)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.18)}
.search input{flex:1;height:auto;background:none;border:0;padding:0;box-shadow:none!important;color:var(--text);font-size:14px;outline:none;min-width:0}
.mode{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.mode select{height:30px;width:auto;font-size:12px;padding:0 8px}
main{flex:1;overflow:auto;padding:6px 22px 28px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:20px 0 12px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;padding:0;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);color:var(--text);cursor:pointer;text-align:left;overflow:hidden;transition:transform .16s,border-color .16s,box-shadow .16s}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 12px 28px rgba(0,0,0,.35);outline:none}
.poster{position:relative;aspect-ratio:2/3;background:linear-gradient(145deg,var(--surface-2),var(--surface))}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;padding:10px}
.rate{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.72);color:#fbbf24;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;backdrop-filter:blur(6px)}
.meta{padding:10px 11px 12px}
.n{font-weight:700;font-size:13px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.5em}
.y{color:var(--muted);font-size:11.5px;margin-top:4px}
.skel .poster,.skel .meta{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.more{display:block;margin:22px auto 0}
.msg{color:var(--muted);text-align:center;padding:50px 0}
.disc{flex:none;padding:7px 22px;font-size:11px;line-height:1.4;color:var(--muted);background:rgba(var(--accent-rgb),.07);border-bottom:1px solid var(--border)}
/* details modal */
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:22px}
#modal.on{display:flex}
.sheet{position:relative;width:min(960px,100%);background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.6);animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.close{position:absolute;top:10px;right:10px;z-index:3;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.close:hover{background:#e81123}
.player{position:relative;aspect-ratio:16/9;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.srcs button[data-k=play]{background:#facc15;border-color:#facc15;color:#1a1300;font-weight:800;padding:6px 20px}.srcs button[data-k=play]:hover{background:#fde047;border-color:#fde047;color:#1a1300}
#fsplay{position:fixed;inset:0;z-index:100;background:#000;display:none}#fsplay.on{display:block}#fsplay iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#fsplay .fsx{position:absolute;top:14px;left:14px;z-index:2;padding:8px 14px;border-radius:999px;border:0;background:rgba(255,255,255,.14);color:#fff;font-weight:600;cursor:pointer}#fsplay .fsx:hover{background:rgba(255,255,255,.26)}
.player .pm.err{color:#fca5a5;line-height:1.6}.player .pm.err b{color:#f87171;font-size:16px}
.player .pm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9ca3af;text-align:center;padding:20px;font-size:14px}
.srcs{display:flex;gap:8px;padding:12px 18px 0;flex-wrap:wrap}
.srcs button{background:var(--surface-2);border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:600}
.srcs button.on{border-color:var(--accent);color:var(--text);background:rgba(var(--accent-rgb),.2)}
.info{padding:16px 20px 22px}
.info h3{margin:0 0 6px;font-size:22px}
.facts{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:12px}
.facts b{color:#fbbf24}
.info p{margin:0;line-height:1.65;color:var(--text);opacity:.9}
</style></head>
<body>
<header>
  <h1>Movies</h1>
  <div class="tabs" id="tabs"></div>
  <label class="search"><span id="sico"></span><input id="q" type="text" placeholder="Search movies" autocomplete="off" spellcheck="false"></label>
  <label class="mode">Network <select id="mode"><option value="auto">Auto</option><option value="proxy">Always proxy</option><option value="direct">Direct only</option></select></label>
</header>
<div class="disc">Note: full movies aren't available right now because of playback issues, so titles currently open trailers only.</div>
<main id="main"></main>
<div id="modal"><div class="sheet" id="sheet"></div></div>

<script src="/js/herb-settings.js"></script><script src="/js/icons.js"></script>
<script src="/uv/uv.bundle.js"></script><script src="/uv/uv.config.js"></script><script src="/baremux/index.js"></script>
<script src="/js/wisp-config.js"></script><script src="/js/proxy-init.js"></script>
<script src="/js/movies.js"></script>
</body></html>
