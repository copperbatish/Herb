<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/images/logo/herb.svg" type="image/svg+xml"><title>Copperchat</title>
<link rel="stylesheet" href="/css/herb.css"><link rel="stylesheet" href="/css/app.css">
<style>body{overflow:hidden;height:100vh;background:#080808}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#fab{position:absolute;right:12px;bottom:12px;z-index:3;display:flex;gap:6px;opacity:0;transition:opacity .2s}body:hover #fab,#fab.show{opacity:1}@media (hover:none){#fab{opacity:1}}
#fab a{background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--border);color:var(--text);text-decoration:none;font-size:12px;padding:6px 10px;border-radius:999px}
#note{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);z-index:0;text-align:center;padding:20px}</style></head>
<body><div id="note"><div>Loading Copperchat…</div><div style="font-size:12px">If this stays blank, open it in a new tab with the button at the bottom-right.</div></div>
<iframe id="f" allow="camera; microphone; clipboard-read; clipboard-write; fullscreen; autoplay; notifications"></iframe>
<div id="fab"><a id="ext" href="#" target="_blank" rel="noopener">Open in new tab ↗</a></div>
<script src="/js/herb-settings.js"></script>
<script src="/js/herb-config.js"></script>
<script>
// Copperchat is served by Herb's own servers (/copperchat/), not Firebase Hosting. Hosted pages use their own address; the single-file
// loader asks HerbConfig for the first working server. An address you set yourself in 'copperchatUrl' still wins.
var f=document.getElementById('f'),OLD='https://copperchat-4cb91.web.app/copperchat/',saved=HerbSettings.get('copperchatUrl');
function where(){
  if(saved&&saved!==OLD)return Promise.resolve(saved);
  if(!(window.HerbConfig&&HerbConfig.single))return Promise.resolve('/copperchat/');
  return HerbConfig.pageHost().then(function(h){return h+'/copperchat/'});
}
where().then(function(u){f.src=u;document.getElementById('ext').href=u});
// If the embedded page hasn't loaded after a few seconds (some browsers refuse to embed it), point to the new-tab button.
var t=setTimeout(function(){document.getElementById('fab').classList.add('show')},4000);f.addEventListener('load',function(){clearTimeout(t);
// Safari/iPad can leave the frame unpainted (black) until something forces a repaint: nudge it a few times.
[0,150,600,1500].forEach(function(ms){setTimeout(function(){f.style.opacity='.999';requestAnimationFrame(function(){f.style.opacity='';f.style.transform='translateZ(0)'})},ms)})});</script></body></html>
