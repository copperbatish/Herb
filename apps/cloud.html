<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/images/logo/herb.svg" type="image/svg+xml"><title>Cloud Games</title>
<link rel="stylesheet" href="/css/herb.css"><link rel="stylesheet" href="/css/app.css">
<style>
body{margin:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;background:#000}
#bar{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:13px;color:var(--muted)}
#bar .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar button{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12.5px}
#bar button:hover{border-color:var(--accent)}
#note{flex:none;display:none;background:#2d2410;color:#fcd34d;border-bottom:1px solid #78570b;padding:8px 14px;font-size:12.5px;line-height:1.5}
#stage{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:20px}
</style></head>
<body>
<div id="bar"><span class="t" id="title">Cloud Games</span><span id="pv" style="font-size:11px;opacity:.6"></span><button id="reload">Reload</button><button id="full">Fullscreen</button></div>
<div id="note"></div>
<div id="diag" style="display:none;position:fixed;left:0;right:0;top:40px;bottom:0;z-index:20;background:rgba(6,12,9,.97);color:#cde7dc;font:12px/1.45 ui-monospace,Menlo,monospace;padding:10px 12px;overflow:auto;-webkit-user-select:text;user-select:text">
 <div style="display:flex;gap:8px;margin-bottom:8px;position:sticky;top:0;background:rgba(6,12,9,.97);padding-bottom:6px"><button id="dcopy">Copy</button><button id="dclear">Clear</button><button id="dclose">Close</button><button id="dnet">Network check</button><span style="opacity:.6;align-self:center">Proxy diagnostics (send this to the developer)</span></div>
 <pre id="dlog" style="white-space:pre-wrap;word-break:break-all;margin:0"></pre></div>
<div id="stage"><div id="msg">Starting the proxy…</div></div>
<script src="/js/herb-settings.js"></script><script src="/js/icons.js"></script>
<script src="/uv/uv.bundle.js"></script><script src="/uv/uv.config.js"></script><script src="/baremux/index.js"></script>
<script src="/js/wisp-config.js"></script><script src="/js/proxy-init.js"></script>
<script>
// Cloud gaming sites that can be launched. Add more here.
// ---- diagnostics: tap the "proxy ..." label ----
var DLOG=[],dstart=Date.now();
function dline(k,m,u){var t=((Date.now()-dstart)/1000).toFixed(1);DLOG.push('+'+t+'s '+k+': '+m+(u?'  ['+String(u).replace(/^https?:\/\//,'').slice(0,60)+']':''));if(DLOG.length>400)DLOG.shift();var p=document.getElementById('dlog');if(p&&document.getElementById('diag').style.display!=='none')p.textContent=DLOG.join('\n')}
function denv(){var st=false;try{st=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches}catch(e){}
 var top3=true;try{void parent.location.href;top3=false}catch(e){}
 return ['page: '+location.origin,'standalone app: '+st,'third-party frame: '+top3,'userAgent: '+navigator.userAgent,'service worker: '+('serviceWorker' in navigator),'storage API: '+(typeof document.hasStorageAccess)].join('\n')}
try{var dbc=new BroadcastChannel('herb-diag');dbc.onmessage=function(e){var d=e.data||{};dline(d.k,d.m,d.u)}}catch(e){dline('diag','BroadcastChannel unavailable','')}
document.addEventListener('DOMContentLoaded',function(){
 $('pv').style.cssText+=';cursor:pointer;text-decoration:underline;padding:6px';
 $('pv').onclick=function(){var d=$('diag');d.style.display=d.style.display==='none'?'block':'none';$('dlog').textContent=denv()+'\n----\n'+DLOG.join('\n')};
 $('dclose').onclick=function(){$('diag').style.display='none'};
 $('dnet').onclick=function(){$('dlog').textContent=denv()+'\n----\n'+DLOG.join('\n');netcheck()};
 $('dclear').onclick=function(){DLOG.length=0;$('dlog').textContent=denv()};
 $('dcopy').onclick=function(){var t=$('dlog').textContent;try{navigator.clipboard.writeText(t).then(function(){$('dcopy').textContent='Copied'},function(){throw 0})}catch(e){var r=document.createRange();r.selectNodeContents($('dlog'));var s=getSelection();s.removeAllRanges();s.addRange(r);$('dcopy').textContent='Selected - tap Copy in the menu'}}});
// ---- Network check: what can THIS network reach? (fetch for web addresses, WebRTC STUN for video-relay style UDP) ----
function netcheck(){
  var web=[['Herb on workers.dev','https://herb.copperbat3.workers.dev/'],['VM (nip.io)','https://129-158-194-64.nip.io/'],['VM (duckdns)','https://lightspeedspeed.duckdns.org/'],['VM (twilightparadox)','https://leweirdlink.twilightparadox.com/'],
    ['this page ('+location.hostname.slice(0,28)+')',location.origin+'/'],['jsDelivr','https://cdn.jsdelivr.net/'],['raw.githubusercontent','https://raw.githubusercontent.com/'],['github.io','https://github.io/'],['pages.dev','https://pages.dev/'],
    ['cloudflare.com','https://www.cloudflare.com/'],['turn.cloudflare.com (TURN, not a web server)','https://turn.cloudflare.com/'],['trycloudflare.com','https://trycloudflare.com/'],['firebaseio.com (Herb database)','https://copperchat-4cb91-default-rtdb.firebaseio.com/.json?shallow=true'],
    ['NVIDIA login','https://login.nvidia.com/'],['GeForce NOW','https://play.geforcenow.com/'],['nvidiagrid.net (game servers)','https://img.nvidiagrid.net/'],['google.com','https://www.google.com/']];
  var stun=[['STUN Cloudflare udp 3478','stun:stun.cloudflare.com:3478'],['STUN Cloudflare udp 53','stun:stun.cloudflare.com:53'],['STUN Google udp 19302','stun:stun.l.google.com:19302']];
  dline('netcheck','starting ('+web.length+' web addresses, '+stun.length+' UDP checks, 4 relay tests, one after another) - takes about 15-60 seconds','');
  // video-relay test by hostname (each of the VM's names): does a relay allocate? uses short-lived credentials from this page's own address
  fetch('/api/turn',{cache:'no-store'}).then(function(r){return r.json()}).then(function(c){
    // one at a time: browsers handle several simultaneous relay allocations unreliably, which would show false "blocked" results
    var tests=[['TURN nip.io, UDP 3478','turn:129-158-194-64.nip.io:3478?transport=udp'],['TURN nip.io, TCP 3478','turn:129-158-194-64.nip.io:3478?transport=tcp'],['TURN duckdns, TCP 3478','turn:lightspeedspeed.duckdns.org:3478?transport=tcp'],['TURN twilightparadox, TCP 3478','turn:leweirdlink.twilightparadox.com:3478?transport=tcp']];
    // a browser can fail the test right after another one for no network reason, so each is tried up to twice before it is called blocked
    (function next(i){if(i>=tests.length){dline('netcheck','finished','');return}var t=tests[i];
      function attempt(n){var done=false,pc;
        function end(ok){if(done)return;done=true;try{pc.close()}catch(x){}
          if(!ok&&n<2){setTimeout(function(){attempt(n+1)},1500);return}
          dline(ok?'net-OK':'net-BLOCKED',t[0]+(ok?'  (relay allocated - usable!)':'  (no relay after 2 tries)'),'');setTimeout(function(){next(i+1)},800)}
        try{pc=new RTCPeerConnection({iceServers:[{urls:t[1],username:c.username,credential:c.credential}],iceTransportPolicy:'relay'});pc.createDataChannel('x');
          pc.onicecandidate=function(e){if(e.candidate&&/ typ relay /.test(e.candidate.candidate))end(true)};
          pc.onicegatheringstatechange=function(){if(pc.iceGatheringState==='complete')setTimeout(function(){end(false)},200)};
          pc.createOffer().then(function(o){return pc.setLocalDescription(o)});setTimeout(function(){end(false)},7000)}catch(e){end(false)}}
      attempt(1)})(0);
  }).catch(function(e){dline('net-BLOCKED','could not get relay credentials from this page ('+e.message+')','')});
  web.forEach(function(w){var t0=Date.now(),c=typeof AbortController==='function'?new AbortController():null,tm=setTimeout(function(){c&&c.abort()},7000);
    fetch(w[1],{mode:'no-cors',cache:'no-store',signal:c?c.signal:undefined}).then(function(){dline('net-OK',w[0]+'  '+(Date.now()-t0)+'ms','')},function(e){dline('net-BLOCKED',w[0]+'  '+((Date.now()-t0)>6500?'(timed out)':'(failed fast)'),'')}).then(function(){clearTimeout(tm)})});
  stun.forEach(function(sv){try{var pc=new RTCPeerConnection({iceServers:[{urls:sv[1]}]}),got=false;pc.createDataChannel('x');
    pc.onicecandidate=function(e){if(e.candidate&&/ typ srflx /.test(e.candidate.candidate)&&!got){got=true;dline('net-OK',sv[0]+'  (UDP reaches it)','');try{pc.close()}catch(x){}}};
    pc.createOffer().then(function(o){return pc.setLocalDescription(o)});
    setTimeout(function(){if(!got){dline('net-BLOCKED',sv[0]+'  (no reply in 8s)','');try{pc.close()}catch(x){}}},8000)}catch(e){dline('net-BLOCKED',sv[0]+' ('+e.message+')','')}});
}
var SITES={geforcenow:{name:'GeForce NOW',url:'https://play.geforcenow.com/'}};
var $=function(i){return document.getElementById(i)};
var key=new URLSearchParams(location.search).get('site')||'geforcenow', site=SITES[key]||SITES.geforcenow, frame=null;
$('title').textContent=site.name+' · cloud gaming';
function launch(){
  $('msg').textContent='Connecting…';
  // Safari/iPadOS treat this app as a third-party frame when Herb was opened from a different address, and then block the storage a sign-in needs.
  try{void parent.location.href}catch(e){
    if(window.top!==window){$('note').style.display='block';$('note').innerHTML='<b>Sign-in may not work here.</b> Herb was opened from a different address than this app, and Safari blocks sign-ins in that case. Open Herb from <a href="'+location.origin+'/" target="_blank" rel="noopener" style="color:inherit">'+location.origin+'/</a> instead (and add that address to your Home Screen).'}
  }
  HerbProxy.init().then(function(){
    return HerbProxy.workerVersion().then(function(v){
      var ok=v===HerbProxy.version;$('pv').textContent='proxy '+(v||'?')+(ok?'':' (old)');
      if(ok){try{sessionStorage.removeItem('herb.swfix')}catch(e){}}
      if(!ok){   // an old proxy worker is still running (common in the iPad home-screen app): remove it and reload once
        var done=false;try{done=sessionStorage.getItem('herb.swfix')}catch(e){}
        if(!done){try{sessionStorage.setItem('herb.swfix','1')}catch(e){}
          return navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.filter(function(r){return r.scope.indexOf(__uv$config.prefix)>=0}).map(function(r){return r.unregister()}))}).then(function(){location.reload();return new Promise(function(){})});}
      }
    });
  }).then(function(){
    frame=document.createElement('iframe');
    frame.setAttribute('allow','fullscreen; gamepad; autoplay; clipboard-read; clipboard-write; pointer-lock'); frame.allowFullscreen=true;
    frame.src=__uv$config.prefix+__uv$config.encodeUrl(site.url);
    $('stage').innerHTML=''; $('stage').appendChild(frame);
    // Video streams use WebRTC, which the proxy can't carry. Without a TURN relay it may stay black if UDP is blocked.
    if(!(__uv$config.inject&&__uv$config.inject.length)){$('note').style.display='block';$('note').innerHTML='<b>Video relay not set up.</b> Cloud gaming streams over WebRTC (UDP), which a web proxy can’t carry. If the picture stays black or never connects, your network is probably blocking UDP – a TURN relay needs to be configured in <code>uv/uv.config.js</code>.'}
  }).catch(function(e){$('msg').textContent='Couldn’t start the proxy: '+e.message});
}
$('reload').onclick=function(){if(frame)frame.src=frame.src};
$('full').onclick=function(){if(frame&&frame.requestFullscreen)frame.requestFullscreen()};
launch();
</script></body></html>
