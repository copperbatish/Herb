<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/images/logo/herb.svg" type="image/svg+xml"><title>Cloud Games</title>
<link rel="stylesheet" href="/css/herb.css"><link rel="stylesheet" href="/css/app.css">
<style>
body{margin:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;background:#000}
body:not(.dbg) #bar{display:none}
#bar{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:13px;color:var(--muted)}
#bar .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar button{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12.5px}
#bar button:hover,#bar button.on{border-color:var(--accent)}
#note{flex:none;display:none;background:#2d2410;color:#fcd34d;border-bottom:1px solid #78570b;padding:8px 14px;font-size:12.5px;line-height:1.5}
#stage{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:20px}
#diag button{background:#16241d;color:#cde7dc;border:1px solid #2c4639;border-radius:6px;padding:5px 10px;font-size:12px}
</style></head>
<body>
<script>if(/[?&]debug=1/.test(location.search))document.body.className='dbg'</script>
<div id="bar"><span class="t" id="title">Cloud Games</span>
 <button id="s-geforcenow" data-site="geforcenow">GeForce NOW</button><button id="s-xbox" data-site="xbox">Xbox</button>
 <span id="pv" style="font-size:11px;opacity:.6">proxy</span>
 <button id="eng" title="Switch the web-proxy engine (Scramjet or Ultraviolet)">Engine</button><button id="reload">Reload</button><button id="full">Fullscreen</button></div>
<div id="note"></div>
<div id="diag" style="display:none;position:fixed;left:0;right:0;top:0;bottom:0;z-index:20;background:rgba(6,12,9,.97);color:#cde7dc;font:12px/1.45 ui-monospace,Menlo,monospace;padding:10px 12px;overflow:auto;-webkit-user-select:text;user-select:text">
 <div style="display:flex;gap:8px;margin-bottom:8px;position:sticky;top:0;background:rgba(6,12,9,.97);padding-bottom:6px"><button id="dcopy">Copy</button><button id="dclear">Clear</button><button id="dnet">Network check</button><button id="dclose">Close</button></div>
 <pre id="dlog" style="white-space:pre-wrap;word-break:break-all;margin:0"></pre></div>
<div id="stage"><div id="msg">Starting the proxy…</div></div>
<script src="/js/herb-settings.js"></script><script src="/js/herb-config.js"></script><script src="/js/icons.js"></script>
<script src="/uv/uv.bundle.js"></script><script src="/uv/uv.config.js"></script><script src="/baremux/index.js"></script>
<script src="/js/wisp-config.js"></script><script src="/js/proxy-init.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
// Cloud gaming sites that can be launched. Add more here.
var SITES={
  geforcenow:{name:'GeForce NOW',url:'https://play.geforcenow.com/'},
  xbox:{name:'Xbox Cloud Gaming',url:'https://play.xbox.com/'}
};
var key=new URLSearchParams(location.search).get('site')||'geforcenow', site=SITES[key]||SITES.geforcenow, frame=null;
if(!SITES[key])key='geforcenow';
$('title').textContent=site.name+' · cloud gaming';
Object.keys(SITES).forEach(function(k){var b=$('s-'+k);b.classList.toggle('on',k===key);b.onclick=function(){if(k!==key)location.search='?site='+k+(document.body.className==='dbg'?'&debug=1':'')}});

// ---- diagnostics: tap the "proxy" label ----
var DLOG=[],dstart=Date.now();
function dline(k,m,u){var t=((Date.now()-dstart)/1000).toFixed(1);DLOG.push('+'+t+'s '+k+': '+m+(u?'  ['+String(u).replace(/^https?:\/\//,'').slice(0,60)+']':''));if(DLOG.length>400)DLOG.shift();var p=$('dlog');if(p&&$('diag').style.display!=='none')p.textContent=denv()+'\n----\n'+DLOG.join('\n')}
function denv(){var st=false;try{st=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches}catch(e){}
 var top3=true;try{void parent.location.href;top3=false}catch(e){}
 return ['page: '+location.origin,'engine: '+HerbProxy.engine(),'standalone app: '+st,'third-party frame: '+top3,'userAgent: '+navigator.userAgent,'service worker: '+('serviceWorker' in navigator)].join('\n')}
try{var dbc=new BroadcastChannel('herb-diag');dbc.onmessage=function(e){var d=e.data||{};dline(d.k,d.m,d.u)}}catch(e){dline('diag','BroadcastChannel unavailable','')}
$('pv').style.cssText+=';cursor:pointer;text-decoration:underline;padding:6px';
$('pv').onclick=function(){var d=$('diag');d.style.display=d.style.display==='none'?'block':'none';$('dlog').textContent=denv()+'\n----\n'+DLOG.join('\n')};
$('dclose').onclick=function(){$('diag').style.display='none'};
$('dnet').onclick=function(){$('dlog').textContent=denv()+'\n----\n'+DLOG.join('\n');netcheck()};
$('dclear').onclick=function(){DLOG.length=0;$('dlog').textContent=denv()};
$('dcopy').onclick=function(){var t=$('dlog').textContent;try{navigator.clipboard.writeText(t).then(function(){$('dcopy').textContent='Copied'},function(){throw 0})}catch(e){var r=document.createRange();r.selectNodeContents($('dlog'));var s=getSelection();s.removeAllRanges();s.addRange(r);$('dcopy').textContent='Selected - copy it'}};
// ---- Network check: what can THIS network reach? ----
function netcheck(){
  var web=[['this page ('+location.hostname.slice(0,28)+')',location.origin+'/'],['jsDelivr','https://cdn.jsdelivr.net/'],['raw.githubusercontent','https://raw.githubusercontent.com/'],
    ['trycloudflare.com','https://trycloudflare.com/'],['NVIDIA login','https://login.nvidia.com/'],['GeForce NOW','https://play.geforcenow.com/'],['nvidiagrid.net (game servers)','https://img.nvidiagrid.net/'],
    ['Xbox Cloud Gaming','https://play.xbox.com/'],['Microsoft login','https://login.live.com/'],['Xbox game servers (xboxlive.com)','https://xboxlive.com/'],['google.com','https://www.google.com/']];
  var stun=[['STUN Cloudflare udp 3478','stun:stun.cloudflare.com:3478'],['STUN Google udp 19302','stun:stun.l.google.com:19302']];
  dline('netcheck','starting ('+web.length+' web addresses, '+stun.length+' UDP checks)','');
  web.forEach(function(w){var t0=Date.now(),c=typeof AbortController==='function'?new AbortController():null,tm=setTimeout(function(){c&&c.abort()},7000);
    fetch(w[1],{mode:'no-cors',cache:'no-store',signal:c?c.signal:undefined}).then(function(){dline('net-OK',w[0]+'  '+(Date.now()-t0)+'ms','')},function(e){dline('net-BLOCKED',w[0]+'  '+((Date.now()-t0)>6500?'(timed out)':'(failed)'),'')}).then(function(){clearTimeout(tm)})});
  stun.forEach(function(sv){try{var pc=new RTCPeerConnection({iceServers:[{urls:sv[1]}]}),got=false;pc.createDataChannel('x');
    pc.onicecandidate=function(e){if(e.candidate&&/ typ srflx /.test(e.candidate.candidate)&&!got){got=true;dline('net-OK',sv[0]+'  (UDP reaches it)','');try{pc.close()}catch(x){}}};
    pc.createOffer().then(function(o){return pc.setLocalDescription(o)});
    setTimeout(function(){if(!got){dline('net-BLOCKED',sv[0]+'  (no reply in 8s)','');try{pc.close()}catch(x){}}},8000)}catch(e){dline('net-BLOCKED',sv[0]+' ('+e.message+')','')}});
}

// ---- Engine: Scramjet (default) or Ultraviolet ----
function setEngLabel(){$('eng').textContent='Engine: Scramjet'}
$('eng').style.display='none';   // Cloud games always use Scramjet

function launch(){
  setEngLabel();$('msg')&&($('msg').textContent='Connecting…');
  // Safari/iPadOS treat this app as a third-party frame when Herb was opened from a different address, and then block the storage a sign-in needs.
  try{void parent.location.href}catch(e){
    if(window.top!==window){$('note').style.display='block';$('note').innerHTML='<b>Sign-in may not work here.</b> Herb was opened from a different address than this app, and Safari blocks sign-ins in that case. Open Herb from <a href="'+location.origin+'/" target="_blank" style="color:#fde68a">'+location.origin+'</a> instead.'}
  }
  var eng='sj';
  Promise.race([HerbProxy.init(),new Promise(function(_,no){setTimeout(function(){no(new Error('proxy start timed out'))},20000)})]).catch(function(e){dline('proxy','init: '+e.message,'')}).then(function(){
    frame=document.createElement('iframe');
    frame.setAttribute('allow','fullscreen; gamepad; autoplay; clipboard-read; clipboard-write; pointer-lock; microphone; camera'); frame.allowFullscreen=true;
    $('stage').innerHTML='';$('stage').appendChild(frame);
    var f0=frame;
    return HerbProxy.open(frame,site.url,{engine:'sj'}).then(function(){dline('engine','Scramjet','')});
  }).catch(function(e){$('stage').innerHTML='<div id="msg"><div>Couldn’t start Scramjet: '+String(e.message).replace(/</g,'&lt;')+'<br><br><button onclick="location.reload()" style="padding:8px 16px;border-radius:8px">Try again</button></div></div>'});
}
$('reload').onclick=function(){if(frame)HerbProxy.open(frame,site.url,{engine:'sj'})};
$('full').onclick=function(){if(frame&&frame.requestFullscreen)frame.requestFullscreen()};
launch();
</script></body></html>
