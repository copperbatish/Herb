<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Herb – a desktop in your browser.">
<link rel="icon" href="/images/logo/herb.svg" type="image/svg+xml"><title>Herb</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/images/logo/icon-180.png">
<meta name="theme-color" content="#0f1b15">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Herb"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<script src="/js/herb-config.js"></script>
<link rel="stylesheet" href="/css/herb.css">
<link rel="stylesheet" href="/css/desktop.css">
</head>
<body>
<div id="desktop">
  <div class="aurora"><i class="a1"></i><i class="a2"></i><i class="a3"></i><i class="stars"></i></div><div class="moon"></div><div class="hill b"></div><div class="hill"></div><div id="flies"></div>
  <div id="icons"></div>
  <div id="wins"><div id="snap"></div></div>
  <div id="start"></div>
  <div id="ctx"></div>
  <div id="topbar"><span id="tb-left"></span><span id="tb-date"></span><span id="tb-right"></span></div>
  <div id="taskbar">
    <button class="tbbtn" id="start-btn" title="Start"></button>
    <div id="tbapps"></div>
    <div id="tbtray">
      <button class="tray" id="trayinfo" title="Proxy status"><span class="sdot" id="sdot"></span><span class="lbl" id="stxt">proxy</span></button>
      <div id="clock"><span class="t"></span><span class="d"></span></div>
      <button id="showdesk" title="Show desktop"></button>
    </div>
  </div>
</div>
<script src="/js/herb-settings.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/wisp-config.js"></script>
<script src="/js/vendor/firebase-app-compat.js"></script>
<script src="/js/vendor/firebase-auth-compat.js"></script>
<script src="/js/vendor/firebase-database-compat.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/desktop.js"></script>
<script src="/js/account-ui.js"></script>
<script src="/js/sync.js"></script>
<script src="/js/store.js"></script>
</body>
</html>
