<!DOCTYPE html>
<html lang="en">

<title>CopperChat</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#R{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;font-size:14px;-webkit-text-size-adjust:100%}
#R{display:flex;flex-direction:column;background:#080808;color:#e2e2e2;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{cursor:pointer;font:inherit;border:none;background:none;color:inherit;padding:0}
input,textarea{font:inherit;color:#e2e2e2;background:none;border:none;outline:none;font-size:16px}
input::placeholder{color:#555}
:root{--c1:#080808;--c2:#101010;--c3:#181818;--c4:#222;--c5:#2e2e2e;--t1:#e2e2e2;--t2:#999;--t3:#666;--acc:#4f7fff;--acc2:rgba(79,127,255,.14);--r:10px;--rL:16px;--rXL:22px;--bd:1px solid rgba(255,255,255,.07)}
.lw{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.lb{width:100%;max-width:360px;background:var(--c2);border:1px solid rgba(255,255,255,.09);border-radius:var(--rXL);padding:30px;display:flex;flex-direction:column;gap:14px}
.llogo{text-align:center;font-size:24px;font-weight:700;letter-spacing:-.4px}.llogo b{color:var(--acc)}
.lsub{text-align:center;color:var(--t3);font-size:12px;margin-top:-8px}
.inp{width:100%;background:var(--c3);border:1px solid rgba(255,255,255,.08);border-radius:var(--r);padding:11px 13px;color:var(--t1)}
.inp:focus{border-color:rgba(79,127,255,.55)}
.err{font-size:12px;color:#f87171;min-height:15px;text-align:center}.ok{color:#4ade80}
.row{display:flex;gap:8px}
.btnP{flex:1;padding:11px;background:var(--acc);color:#fff;font-weight:600;border-radius:var(--r)}
.btnS{flex:1;padding:11px;background:var(--c4);color:var(--t1);font-weight:600;border-radius:var(--r);border:1px solid rgba(255,255,255,.08)}
.btnG{display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;background:#fff;color:#111;font-weight:600;border-radius:var(--r)}
.btnP:disabled,.btnS:disabled{opacity:.5}
.link{color:var(--t2);font-size:12px;text-align:center;text-decoration:underline}
.div{display:flex;align-items:center;gap:10px;color:var(--t3);font-size:11px}.div::before,.div::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.07)}
.shell{flex:1;display:flex;overflow:hidden;min-height:0}
.sb{width:64px;background:#0a0a0a;border-right:var(--bd);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px;flex-shrink:0}
.sbi{position:relative;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--t3);flex-shrink:0;transition:all .2s}
.sbi:hover{background:var(--c3);color:var(--t1)}.sbi.on{background:var(--acc2);color:var(--acc)}
.sbi svg{width:19px;height:19px}
.sep{width:28px;height:1px;background:rgba(255,255,255,.07);flex-shrink:0}
.srvl{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;overflow-y:auto;scrollbar-width:none}
.srb{position:relative;width:44px;height:44px;border-radius:22px;background:var(--c3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;overflow:hidden;color:var(--t2);flex-shrink:0;transition:all .22s}
.srb:hover,.srb.on{border-radius:14px;background:var(--acc);color:#fff}.srb img{width:100%;height:100%;object-fit:cover}
.dot{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;background:#f87171;border-radius:8px;font-size:10px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid #0a0a0a}
.col{width:250px;background:#0b0b0b;border-right:var(--bd);display:flex;flex-direction:column;flex-shrink:0;min-height:0}
.colh{padding:16px 16px 10px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cols{overflow-y:auto;flex:1;padding:4px 8px}
.item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--t2);position:relative}
.item:hover{background:rgba(255,255,255,.04)}.item.on{background:var(--acc2);color:var(--t1)}
.item.unread{color:#fff;font-weight:600}.item.unread::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--acc);margin-left:auto}
.item .meta{flex:1;min-width:0}.item .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .ls{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#0c0c0c;min-width:0}
.chdr{min-height:52px;border-bottom:var(--bd);display:flex;align-items:center;padding:0 14px;gap:9px;flex-shrink:0}
.chdr .t{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{color:var(--t3);border-radius:8px;padding:6px;display:flex}.ib:hover{color:var(--t1);background:var(--c3)}.ib svg{width:18px;height:18px}
.back{display:none}
.item .ts{font-size:10px;color:var(--t3);font-weight:400;flex-shrink:0;align-self:flex-start;margin-top:2px}
.av.gav{background:linear-gradient(135deg,#4f7fff,#a78bfa)}.av.gav svg{width:55%;height:55%}
.srb.unr{box-shadow:0 0 0 2px #fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:flex;align-items:center;gap:6px;background:var(--c4);border-radius:14px;padding:4px 6px 4px 10px;font-size:12px}.chip button{color:var(--t3);font-size:13px}
.msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.day{align-self:center;font-size:10px;color:var(--t3);margin:10px 0 4px;letter-spacing:.5px}
.mr{display:flex;gap:11px;padding:2px 6px;border-radius:8px;margin-top:8px}.mr.cont{margin-top:0}.mr.cont .av,.mr.cont .mm{visibility:hidden;height:0}.mr.cont .av{height:0}
.mr:hover{background:rgba(255,255,255,.02)}
.av{width:36px;height:36px;border-radius:50%;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--acc);color:#fff}.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:30px;height:30px;font-size:11px}.av.lg{width:72px;height:72px;font-size:26px}
.mb{flex:1;min-width:0}.mm{display:flex;align-items:baseline;gap:7px;margin-bottom:1px}.mn{font-weight:600;font-size:13px;color:#fff}.mt{font-size:10px;color:var(--t3)}
.mx{font-size:14px;color:#c4c8d0;line-height:1.5;word-break:break-word;white-space:pre-wrap}.mx a{color:#7aa2ff}
.mdel{opacity:0;color:var(--t3);font-size:11px;margin-left:auto}.mr:hover .mdel{opacity:1}
.ftr{padding:10px 12px;flex-shrink:0}
.irow{display:flex;align-items:flex-end;gap:8px;background:var(--c3);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:4px 8px 4px 14px}
.mi{flex:1;padding:9px 0;max-height:120px;resize:none;overflow-y:auto;line-height:1.4}
.bsend{width:34px;height:34px;border-radius:10px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-bottom:1px}.bsend:disabled{opacity:.3}.bsend svg{width:15px;height:15px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--t3);padding:32px;text-align:center}.empty h3{color:var(--t1);font-size:16px}.empty p{font-size:13px;max-width:280px;line-height:1.6;color:var(--t2)}
.mwrap{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.72)}
.mc{width:100%;max-width:380px;max-height:90vh;overflow:auto;background:var(--c2);border:1px solid rgba(255,255,255,.1);border-radius:var(--rXL);padding:24px;display:flex;flex-direction:column;gap:14px}
.mhdr{display:flex;justify-content:space-between;align-items:center}.mhdr h3{font-size:16px}
.sub{font-size:12px;color:var(--t3)}.slbl{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.7px;text-transform:uppercase;margin:6px 0 8px}
.pr{flex:1;overflow-y:auto;padding:22px 18px}.card{background:var(--c3);border:var(--bd);border-radius:var(--rL);padding:16px;margin-bottom:16px}
.hero{display:flex;align-items:center;gap:16px}.hero b{font-size:18px}.hero small{display:block;color:var(--t3);margin-top:2px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-size:13px}
.swt{width:42px;height:24px;border-radius:12px;background:var(--c5);position:relative;flex-shrink:0;transition:background .2s}.swt::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}.swt.on{background:var(--acc)}.swt.on::after{left:21px}
.sres{background:var(--c3);border:var(--bd);border-radius:var(--r);overflow:hidden;margin:6px 8px}
.danger{color:#f87171;font-size:13px;font-weight:600;padding:8px 0}
.code{font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:3px;text-align:center;background:var(--c3);border:1px dashed rgba(255,255,255,.2);border-radius:var(--r);padding:12px;user-select:all}
.mem{display:flex;align-items:center;gap:9px;padding:6px 0}.mem .nm{flex:1;font-size:13px}.mem small{color:var(--t3)}
@media (max-width:760px){
  .col{width:100%;border-right:none}
  .shell[data-pane="chat"] .col,.shell[data-pane="chat"] .sb{display:none}
  .shell[data-pane="list"] .main{display:none}
  .back{display:flex}
  .sb{width:58px}
}
</style>

<body>
<div id="R"></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js';
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, deleteField, onSnapshot, query, where, orderBy, limit, startAt, endAt, serverTimestamp, writeBatch } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js';
import { getAuth, signInAnonymously, EmailAuthProvider, linkWithCredential, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js';

const app = initializeApp({
  apiKey: "AIzaSyB05wOLEOkrp7FEqbS_ryvby1kBMfD9WNA", authDomain: "copperchat-4cb91.firebaseapp.com", projectId: "copperchat-4cb91",
  storageBucket: "copperchat-4cb91.firebasestorage.app", messagingSenderId: "1045463824701", appId: "1:1045463824701:web:6c40cf5167c05bb1a56d54"
});
const auth = getAuth(app), db = getFirestore(app);
// Mineplacer lives in a different Firebase project. A second app instance talks to it (anonymous sign-in, same as Mineplacer itself) for account linking.
const mpApp = initializeApp({ apiKey: "AIzaSyCSzeZJlKbOF_uG6rLrHFuqaulfVaZl2cA", authDomain: "cloud-4f3d4.firebaseapp.com", projectId: "cloud-4f3d4", appId: "1:814188421792:web:d520026b99a4029c971fc5" }, 'mp');
const mpAuth = getAuth(mpApp), mpDb = getFirestore(mpApp);
const mpReady = async () => { if (!mpAuth.currentUser) await signInAnonymously(mpAuth); };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PHOTO = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;
const safePhoto = (p) => (typeof p === 'string' && p.length < 60000 && PHOTO.test(p)) ? p : '';
const avatar = (p, name, cls = '') => safePhoto(p && p.photo !== undefined ? p.photo : p) ? `<div class="av ${cls}"><img alt="" src="${safePhoto(p && p.photo !== undefined ? p.photo : p)}"></div>` : `<div class="av ${cls}">${esc((name || '?')[0].toUpperCase())}</div>`;
const linkify = (t) => esc(t).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, (u) => `<a href="${u}" target="_blank" rel="noopener noreferrer nofollow">${u}</a>`);
const ICON = {
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>',
  dm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  join: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  grp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  gplus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="17" y1="11" x2="23" y2="11"/></svg>',
  ppl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>'
};

/* ---------------- state ---------------- */
let me = null, prof = null;
const S = { tab: 'dms', dmUid: null, grpId: null, groups: [], friends: [], freqs: [], srvChans: {}, srvId: null, chId: null, dms: [], servers: [], reads: {}, blocks: {}, channels: [], members: [], srvDoc: null, pane: 'list', showMembers: false };
const users = new Map();                    // uid -> profile (cached promises, so a name is fetched once)
const subs = { top: [], chat: null, srv: [], sw: {} };
const getUser = (uid) => { if (!users.has(uid)) users.set(uid, getDoc(doc(db, 'cc_users', uid)).then((s) => (s.exists() ? { uid, ...s.data() } : { uid, name: 'Unknown', handle: '?' })).catch(() => ({ uid, name: 'Unknown', handle: '?' }))); return users.get(uid); };
const findUsers = async (v) => { try { const snap = await getDocs(query(collection(db, 'cc_users'), orderBy('handle'), startAt(v), endAt(v + '\uf8ff'), limit(8))); return snap.docs.filter((d) => d.id !== me.uid).map((d) => ({ uid: d.id, ...d.data() })); } catch (e) { return []; } };
const dmId = (a, b) => [a, b].sort().join('_');
const ms = (t) => (t && t.toMillis ? t.toMillis() : (typeof t === 'number' ? t : 0));

function resizeImg(file, mx) {
  return new Promise((ok, no) => {
    const r = new FileReader();
    r.onerror = no;
    r.onload = (e) => { const i = new Image(); i.onerror = no; i.onload = () => { const c = document.createElement('canvas'); let w = i.width, h = i.height; const k = Math.min(1, mx / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k); c.width = w; c.height = h; c.getContext('2d').drawImage(i, 0, 0, w, h); ok(c.toDataURL('image/jpeg', 0.8)); }; i.src = e.target.result; };
    r.readAsDataURL(file);
  });
}
const toast = (m) => { const t = document.createElement('div'); t.textContent = m; t.style.cssText = 'position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;border:1px solid rgba(255,255,255,.15);padding:10px 16px;border-radius:12px;z-index:999;font-size:13px;max-width:90vw'; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); };
const fail = (e, where) => { console.warn(where || '', e); toast(e && e.code === 'permission-denied' ? 'Not allowed' + (where ? ' (' + where + ')' : '') + '. If this is every screen, the CopperChat Firestore rules are not published yet.' : 'Something went wrong. Check your connection.'); };
const failAt = (where) => (e) => fail(e, where);

/* ---------------- sign in ---------------- */
function renderLogin(note) {
  $('R').innerHTML = `<div class="lw"><div class="lb">
    <div class="llogo">Copper<b>Chat</b></div><p class="lsub">Private. Realtime. Yours.</p>
    <input id="le" class="inp" type="text" placeholder="Username (or email)" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    <input id="lp" class="inp" type="password" placeholder="Password (8+ characters)" autocomplete="current-password">
    <div id="lerr" class="err">${esc(note || '')}</div>
    <div class="row"><button class="btnP" id="lsi">Sign in</button><button class="btnS" id="lsu">Create account</button></div>
    <button class="link" id="lfp">Forgot password?</button>
    <div class="div">or</div>
    <button class="btnG" id="lgg"><img alt="" width="17" height="17" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">Continue with Google</button>
    <p class="sub" style="text-align:center;margin-top:-2px;line-height:1.5">No email needed: just pick a username and password, press Create account, then choose your @handle. Your account is saved, and the same username and password also work on Herb.</p>
  </div></div>`;
  const msg = (m, good) => { $('lerr').textContent = m; $('lerr').className = 'err' + (good ? ' ok' : ''); };
  const nice = (e) => ({ 'auth/invalid-credential': 'Wrong email or password.', 'auth/email-already-in-use': 'That email already has an account. Sign in instead.', 'auth/weak-password': 'Password needs 8+ characters.', 'auth/invalid-email': 'That email looks wrong.', 'auth/too-many-requests': 'Too many tries. Wait a minute.', 'auth/popup-closed-by-user': '' }[e.code] ?? 'Could not sign in.');
  // a plain username becomes "<name>@herb.local" behind the scenes (never shown, never emailed); anything with an @ is treated as a real email, so older accounts still work
  const toId = (v) => { v = v.trim(); if (v.includes('@')) return v; v = v.toLowerCase(); if (!/^[a-z0-9_]{3,20}$/.test(v)) throw new Error('Username: 3-20 letters, numbers or _ (no spaces).'); return v + '@herb.local'; };
  const idErr = (e) => { if (e && e.code === 'auth/invalid-credential') return 'Wrong username or password.'; if (e && e.code === 'auth/email-already-in-use' && !$('le').value.includes('@')) return 'That username is taken.'; return e && e.code ? nice(e) : (e && e.message) || 'Could not sign in.'; };
  $('lsi').onclick = async () => { try { await signInWithEmailAndPassword(auth, toId($('le').value), $('lp').value); } catch (e) { msg(idErr(e)); } };
  $('lsu').onclick = async () => { if ($('lp').value.length < 8) return msg('Password needs 8+ characters.'); try { await createUserWithEmailAndPassword(auth, toId($('le').value), $('lp').value); } catch (e) { msg(idErr(e)); } };
  $('lfp').onclick = async () => { if (!$('le').value.trim()) return msg('Type your email above first.'); if (!$('le').value.includes('@')) return msg('Username accounts have no email, so they can\'t be reset. Keep your password somewhere safe.'); try { await sendPasswordResetEmail(auth, $('le').value.trim()); msg('Reset link sent. Check your email.', true); } catch (e) { msg(nice(e)); } };
  $('lgg').onclick = async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (e) { if (/popup-blocked|operation-not-supported|web-storage/.test(e.code || '')) { try { await signInWithRedirect(auth, new GoogleAuthProvider()); } catch (x) { msg(nice(x)); } } else msg(nice(e)); } };
}

/* ---------------- first run: pick a @handle ---------------- */
function renderOnboard() {
  const guess = (me.displayName || (me.email || '').split('@')[0] || 'user').toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 20);
  $('R').innerHTML = `<div class="lw"><div class="lb">
    <div class="llogo">Welcome</div><p class="lsub">Pick a @handle (people find you with it) and a display name.</p>
    <input id="oh" class="inp" placeholder="handle, e.g. copper_bat" maxlength="20" autocapitalize="none" value="${esc(guess.length >= 3 ? guess : '')}">

const unreadOf = (id, last, lastFrom) => lastFrom !== me.uid && ms(last) > (S.reads[id] || 0);

const srvUnread = (sid) => (S.srvChans[sid] || []).filter((c) => unreadOf(`${sid}_${c.id}`, c.lastAt, c.lastBy)).length;

/* ---------------- main pane ---------------- */
let mainKey = '';
async function paintMain(force) {

async function acceptFriend(from) {
  try { const b = writeBatch(db); b.set(doc(db, 'cc_friends', me.uid, 'list', from), { at: serverTimestamp() }); b.set(doc(db, 'cc_friends', from, 'list', me.uid), { at: serverTimestamp() }); b.delete(doc(db, 'cc_freq', me.uid, 'from', from)); await b.commit(); toast('You are friends now.'); } catch (e) { fail(e); }
}
function closeChatSub() { if (subs.chat) { subs.chat(); subs.chat = null; } }

function paintChat(M, c) {
  const blocked = c.dm && S.blocks[c.dm.uid];
  M.innerHTML = `<div class="chdr"><button class="ib back" id="bk">${ICON.back}</button>${c.dm ? avatar(c.dm, c.dm.name, 'sm') : (c.grp ? `<div class="av sm gav">${ICON.grp}</div>` : '')}<div class="t">${esc(c.title)} <span class="sub" style="font-weight:400">${esc(c.sub)}</span></div>
      ${c.grp ? `<button class="ib" id="grm" title="Group info">${ICON.more}</button>` : c.dm ? `<button class="ib" id="dmm" title="More">${ICON.more}</button>` : (S.tab === 'srv' ? `<button class="ib" id="mbr" title="Members">${ICON.ppl}</button>` : '')}</div>
    <div class="msgs" id="msgs"></div>
    <div class="ftr">${blocked ? '<div class="sub" style="text-align:center;padding:8px">You blocked this person. Unblock them from the ⋯ menu to chat.</div>' : `<div class="irow"><textarea class="mi" id="mi" rows="1" placeholder="Message ${esc(c.title)}" maxlength="2000"></textarea><button class="bsend" id="bs" disabled>${ICON.send}</button></div>`}</div>`;
  $('bk').onclick = () => { if (S.tab === 'dms') go({ dmUid: null, grpId: null }); else go({ chId: null }); };
  if (c.grp) $('grm').onclick = () => modalGroupInfo(c.grp.id);
  if (c.dm) $('dmm').onclick = () => modalDm(c.dm);
  if ($('mbr')) $('mbr').onclick = modalMembers;

  if (mi) {
    mi.oninput = () => { bs.disabled = !mi.value.trim(); mi.style.height = 'auto'; mi.style.height = Math.min(120, mi.scrollHeight) + 'px'; };
    mi.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(c); } };
    bs.onclick = () => send(c);

  subs.chat = onSnapshot(q, async (snap) => {
    const list = snap.docs.map((d) => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) })).reverse();
    const profs = await Promise.all([...new Set(list.map((m) => m.from))].map(getUser)); const byId = Object.fromEntries(profs.map((p) => [p.uid, p]));
    const el = $('msgs'); if (!el) return;
    const stick = el.scrollHeight - el.scrollTop - el.clientHeight < 120; let html = '', lastDay = '', prev = null;
    for (const m of list) {
      const t = ms(m.at), d = new Date(t), day = d.toDateString(), p = byId[m.from] || { name: '?' };
      if (day !== lastDay) { html += `<div class="day">${esc(d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase())}</div>`; lastDay = day; prev = null; }
      const cont = prev && prev.from === m.from && t - ms(prev.at) < 300000;
      html += `<div class="mr ${cont ? 'cont' : ''}">${avatar(p, p.name)}<div class="mb"><div class="mm"><span class="mn">${esc(p.name)}</span><span class="mt">${esc(d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }))}</span>${m.from === me.uid ? `<button class="mdel" data-m="${esc(m.id)}">delete</button>` : ''}</div><div class="mx">${linkify(m.text)}</div></div></div>`;
      prev = m;
    }
    el.innerHTML = html || '<div class="empty"><p>No messages yet. Say hi 👋</p></div>';
    el.querySelectorAll('.mdel').forEach((b) => { b.onclick = () => deleteDoc(doc(db, ...c.path, b.dataset.m)).catch(fail); });
    if (stick) el.scrollTop = el.scrollHeight;

}
function markRead(c) {

  if (!t || (S.reads[c.id] || 0) >= t || document.hidden) return;
  S.reads[c.id] = t; setDoc(doc(db, 'cc_users', me.uid, 'reads', c.id), { at: serverTimestamp() }).catch(() => {});
  paintServers(); updateBadge();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) paint(); });

async function send(c) {
  const mi = $('mi'), text = (mi.value || '').trim(); if (!text) return;
  mi.value = ''; $('bs').disabled = true; mi.style.height = 'auto';
  try {
    const b = writeBatch(db), mref = doc(collection(db, ...c.path));
    if (c.dm) {
      const ref = doc(db, 'cc_dms', c.id);
      if (!S.dms.find((d) => d.id === c.id)) { const s = await getDoc(ref); if (!s.exists()) await setDoc(ref, { members: [me.uid, c.dm.uid].sort(), lastText: '', lastFrom: me.uid, lastAt: serverTimestamp() }); }
      b.set(mref, { from: me.uid, text, at: serverTimestamp() });
      b.update(ref, { lastText: text.slice(0, 120), lastFrom: me.uid, lastAt: serverTimestamp() });
    } else if (c.grp) {

    } else {
      b.set(mref, { from: me.uid, text, at: serverTimestamp() });

    }

  } catch (e) { mi.value = text; $('bs').disabled = false; fail(e); }
}

/* ---------------- servers ---------------- */

    if (!s.exists()) { deleteDoc(doc(db, 'cc_users', me.uid, 'servers', id)).catch(() => {}); toast('That server is gone.'); go({ tab: 'dms' }); return; }

    $('cl-off').onclick = async () => { try { await deleteDoc(doc(db, 'mp_classic', prof.mp)); clShow(false); mpOut('Classic sign-in is off.', true); } catch (e) { mpOut('Could not turn it off.'); } };
  }
  if ($('ml-go')) $('ml-go').onclick = async () => {
    const name = $('ml-user').value.trim().toLowerCase(), code = $('ml-code').value.trim().toUpperCase();
    if (!/^[a-z0-9_]{3,16}$/.test(name) || code.length !== 6) return mpOut('Enter your Mineplacer username and the 6-character code.');
    if (!confirm('Move "' + name + '" to CopperChat sign-in? The old Mineplacer password will stop working.')) return;
    $('ml-go').disabled = true;
    try {
      const { ref, d } = await mpDoc(name), lc = d && d.linkCode;
      if (!lc || lc.c !== code || !(lc.exp > Date.now())) { $('ml-go').disabled = false; return mpOut('That code is wrong or expired. Make a new one in Mineplacer > Settings.'); }
      if (d.migratedTo) { $('ml-go').disabled = false; return mpOut('That account was already moved.'); }
      if (d.banned) { $('ml-go').disabled = false; return mpOut('That account is banned and cannot be moved.'); }
      const skip = ['password', 'linkCode', 'ccLink', 'cmds', 'friends', 'friendReqs', 'invites', 'fcode', 'lastSeen', 'banned', 'banReason', 'coAdmin', 'adminPerms', 'migratedTo'], acc = {};
      for (const k of Object.keys(d)) if (!skip.includes(k) && d[k] !== undefined) acc[k] = d[k];
      acc.username = name;
      const b = writeBatch(db);
      b.set(doc(db, 'mp_names', name), { uid: me.uid });
      b.set(doc(db, 'mp_accounts', me.uid), acc);
      b.set(doc(db, 'mp_profiles', me.uid), { username: name, displayName: String(d.displayName || '').slice(0, 16), highWave: +d.highWave || 0, mpHigh: +d.mpHigh || 0, crowns: +d.crowns || 0, look: d.look && typeof d.look === 'object' ? d.look : {}, skinsN: (d.skins || []).length, isBot: !!d.isBot, anon: !!(d.anon || d.anonForced), profVis: d.profVis === 'private' ? 'private' : 'friends', lastSeen: Date.now() });
      await b.commit();
      await updateDoc(ref, { migratedTo: me.uid, password: Array.from(crypto.getRandomValues(new Uint8Array(18)), (n) => 'abcdefghijklmnopqrstuvwxyz0123456789'[n % 36]).join(''), linkCode: deleteField(), ccLink: { uid: me.uid, handle: prof.handle, at: Date.now() } });
      await updateDoc(doc(db, 'cc_users', me.uid), { mp: name }); users.delete(me.uid); toast('Moved! Sign in to Mineplacer with CopperChat.');
    } catch (e) { $('ml-go').disabled = false; mpOut(e && e.code === 'permission-denied' ? 'The CopperChat rules for Mineplacer accounts are not published yet.' : 'Could not move it. Check your connection.'); console.warn(e); }
  };
  if ($('pe')) $('pe').onclick = enablePush;
  if ($('po')) $('po').onclick = async () => { try { const reg = await navigator.serviceWorker.getRegistration('/copperchat/'); const sub = reg && await reg.pushManager.getSubscription(); if (sub) { await deleteDoc(doc(db, 'cc_push', me.uid, 'subs', await sha(sub.endpoint))).catch(() => {}); await sub.unsubscribe(); } paintProfile($('main')); } catch (e) { fail(e); } };
  if ($('pa')) $('pa').onclick = () => { const on = $('pa').classList.toggle('on'); localStorage.setItem('cc_alerts', on ? 'on' : 'off'); };
}
async function enablePush() {
  try {
    const perm = await Notification.requestPermission();    // must run straight from the tap, iOS insists
    if (perm !== 'granted') { $('pe2').textContent = 'Permission was not granted.'; return; }
    localStorage.setItem('cc_alerts', 'on'); const reg = await navigator.serviceWorker.register('sw.js', { scope: '/copperchat/' }); await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(VAPID_PUBLIC) }), j = sub.toJSON();   // what lets the server reach this device even when the app is closed
    await setDoc(doc(db, 'cc_push', me.uid, 'subs', await sha(j.endpoint)), { endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, ua: navigator.userAgent.slice(0, 120), at: serverTimestamp() });
    toast('Banner alerts on.'); paintProfile($('main'));
  } catch (e) { fail(e); }
}
// a banner for a message that arrived while the app is hidden (shown through the service worker, which is what iOS wants)
async function bannerFor(title, body, tag, url) {
  if (!document.hidden || !alertsOn() || !('Notification' in window) || Notification.permission !== 'granted') return;
  try { const reg = await navigator.serviceWorker.getRegistration('/copperchat/'); if (reg) reg.showNotification(title, { body, tag, renotify: true, icon: 'icon-192.png', data: { url } }); } catch (e) {}
}
const lastAtSeen = new Map();
function alertChats(list, kind) {
  for (const d of list) {
    const id = kind + d.id, t = ms(d.lastAt), prev = lastAtSeen.get(id);
    if (prev !== undefined && t > prev && d.lastFrom !== me.uid && d.lastText) getUser(d.lastFrom).then((u) => (kind === 'g' ? bannerFor(d.name, `${u.name}: ${d.lastText}`, 'grp-' + d.id, location.origin + '/copperchat/#grp=' + d.id) : bannerFor(u.name, d.lastText, 'dm-' + d.lastFrom, location.origin + '/copperchat/#dm=' + d.lastFrom)));
    lastAtSeen.set(id, t);
  }
}
// every server I'm in is watched (just the channel list), so channels light up as unread and a banner can fire for a new server message
async function alertChannel(sid, c) {
  const srv = S.servers.find((x) => x.id === sid); if (!document.hidden || (srv && srv.notify === false)) return;
  try {
    const q = await getDocs(query(collection(db, 'cc_servers', sid, 'channels', c.id, 'messages'), orderBy('at', 'desc'), limit(1))); const m = q.docs[0] && q.docs[0].data(); if (!m || m.from === me.uid) return;
    const u = await getUser(m.from); bannerFor(`${srv ? srv.name : 'Server'} · #${c.name}`, `${u.name}: ${m.text}`, `srv-${sid}-${c.id}`, `${location.origin}/copperchat/#srv=${sid}/${c.id}`);
  } catch (e) {}
}
const chSeen = new Map();
function watchServers() {
  const want = new Set(S.servers.map((x) => x.id));
  for (const sid of Object.keys(subs.sw)) if (!want.has(sid)) { subs.sw[sid](); delete subs.sw[sid]; delete S.srvChans[sid]; }
  for (const sid of want) if (!subs.sw[sid]) subs.sw[sid] = onSnapshot(collection(db, 'cc_servers', sid, 'channels'), (snap) => {
    const list = snap.docs.map((d) => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) }));
    for (const c of list) { const k = sid + '_' + c.id, t = ms(c.lastAt), prev = chSeen.get(k); if (prev !== undefined && t > prev && c.lastBy !== me.uid) alertChannel(sid, c); chSeen.set(k, t); }
    S.srvChans[sid] = list; paintServers(); updateBadge();
  }, () => {});
}

/* ---------------- boot ---------------- */
function stopAll() { subs.top.forEach((u) => u()); subs.top = []; Object.values(subs.sw).forEach((u) => u()); subs.sw = {}; S.srvChans = {}; chSeen.clear(); closeChatSub(); closeServerSubs(); }
async function sendDmTo(uid, text) {
  const id = dmId(me.uid, uid), ref = doc(db, 'cc_dms', id);
  if (!S.dms.find((d) => d.id === id)) { const s = await getDoc(ref); if (!s.exists()) await setDoc(ref, { members: [me.uid, uid].sort(), lastText: '', lastFrom: me.uid, lastAt: serverTimestamp() }); }
  const b = writeBatch(db); b.set(doc(collection(db, 'cc_dms', id, 'messages')), { from: me.uid, text, at: serverTimestamp() });
  b.update(ref, { lastText: text.slice(0, 120), lastFrom: me.uid, lastAt: serverTimestamp() }); await b.commit();
}
async function modalMpInvite(uid, code) {
  if (uid === me.uid) return;
  const o = await getUser(uid), text = `🎮 Join my Mineplacer party! Code: ${code}  (Mineplacer > Party up > Join)`;
  modal(`<div class="mhdr"><h3>Send a Mineplacer invite?</h3><button class="ib" data-x>✕</button></div><p class="sub">This will message ${esc(o.name)} (@${esc(o.handle)}):</p><div class="card" style="margin:0">${esc(text)}</div><div class="err" id="e"></div><button class="btnP" id="go" style="flex:none">Send</button>`, (close) => {
    $('go').onclick = async () => { $('go').disabled = true; try { await sendDmTo(uid, text); close(); go({ tab: 'dms', dmUid: uid, grpId: null }); } catch (e) { $('go').disabled = false; $('e').textContent = 'Could not send it.'; } };
  });
}
function route() {
  const h = location.hash.slice(1); if (!h || !prof) return;
  const mi = /^mpinvite=([A-Za-z0-9]{20,40}):([A-Z0-9]{5})$/.exec(h);
  if (mi) { go({ tab: 'dms' }); modalMpInvite(mi[1], mi[2]); }
  else if (h === 'mpreset' || h === 'mplink') { mainKey = ''; go({ tab: 'me' }); }
  const gm = /^grp=([A-Za-z0-9]+)$/.exec(h), m = /^dm=([A-Za-z0-9]+)$/.exec(h), s = /^srv=([A-Za-z0-9]+)\/([a-z0-9-]+)$/.exec(h);
  if (gm) go({ tab: 'dms', grpId: gm[1] }); else if (m) go({ tab: 'dms', dmUid: m[1] }); else if (s) go({ tab: 'srv', srvId: s[1], chId: s[2] });
  history.replaceState(null, '', location.pathname);
}
window.addEventListener('hashchange', route);
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { scope: '/copperchat/' }).catch(() => {});
  navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.type === 'open') { try { location.hash = new URL(e.data.url).hash; } catch (x) {} } });
}
onAuthStateChanged(auth, (u) => {
  stopAll(); me = u; prof = null; S.dms = []; S.groups = []; S.friends = []; S.freqs = []; S.servers = []; S.reads = {}; S.blocks = {}; users.clear(); lastAtSeen.clear();
  if (!u) { renderLogin(); return; }
  subs.top.push(onSnapshot(doc(db, 'cc_users', u.uid), (s) => {
    if (!s.exists()) { prof = null; renderOnboard(); return; }
    const first = !prof; prof = { uid: u.uid, ...s.data() };
    if (first) {
      renderShell();
      subs.top.push(onSnapshot(query(collection(db, 'cc_dms'), where('members', 'array-contains', u.uid)), (q) => { S.dms = q.docs.map((d) => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) })); alertChats(S.dms, 'd'); paint(); }, failAt('conversations')));
      subs.top.push(onSnapshot(query(collection(db, 'cc_groups'), where('members', 'array-contains', u.uid)), (q) => { S.groups = q.docs.map((d) => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) })); if (S.grpId && !S.groups.find((g) => g.id === S.grpId)) { S.grpId = null; if (S.tab === 'dms') S.pane = 'list'; } alertChats(S.groups, 'g'); paint(); }, failAt('groups')));
      subs.top.push(onSnapshot(collection(db, 'cc_friends', u.uid, 'list'), (q) => { S.friends = q.docs.map((d) => d.id); paint(); }, () => {}));
      subs.top.push(onSnapshot(collection(db, 'cc_freq', u.uid, 'from'), (q) => { S.freqs = q.docs.map((d) => d.id); paint(); }, () => {}));
      subs.top.push(onSnapshot(collection(db, 'cc_users', u.uid, 'servers'), (q) => { S.servers = q.docs.map((d) => ({ id: d.id, ...d.data() })); watchServers(); paintServers(); }, failAt('servers')));
      subs.top.push(onSnapshot(collection(db, 'cc_users', u.uid, 'reads'), (q) => { S.reads = Object.fromEntries(q.docs.map((d) => [d.id, ms(d.data().at)])); paint(); }, () => {}));
      subs.top.push(onSnapshot(collection(db, 'cc_users', u.uid, 'blocks'), (q) => { S.blocks = Object.fromEntries(q.docs.map((d) => [d.id, 1])); }, () => {}));
      route();
    } else if (S.tab === 'me') paintProfile($('main'));
  }, failAt('profile')));
});
